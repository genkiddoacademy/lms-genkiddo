name: lms-prod
services:
    frappe:
        image: lms-genkiddo:latest
        ports:
            - "8000:8000"
            - "9000:9000"
        environment:
            - DB_HOST=mariadb
            - REDIS_CACHE=redis:6379
            - REDIS_QUEUE=redis:6379
            - REDIS_SOCKETIO=redis:6379
        depends_on:
            - mariadb
            - redis
        restart: unless-stopped
        # NO volume mounts for code!

    mariadb:
        image: mariadb:10.8
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-production-secret-123}
        volumes:
            - mariadb-prod-data:/var/lib/mysql
        restart: unless-stopped

    redis:
        image: redis:alpine
        volumes:
            - redis-prod-data:/data
        restart: unless-stopped

volumes:
    mariadb-prod-data:
    redis-prod-data:
