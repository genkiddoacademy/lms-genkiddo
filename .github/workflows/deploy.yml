name: Build & Deploy

on:
    push:
        branches: [main, develop]
        tags: ["v*"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Get version
              id: ver
              run: |
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  else
                    echo "VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT
                  fi
                  echo "COMMIT=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                  echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to Registry
              uses: docker/login-action@v2
              with:
                  registry: ${{ secrets.REGISTRY_URL }}
                  username: ${{ secrets.REGISTRY_USER }}
                  password: ${{ secrets.REGISTRY_PASS }}

            - name: Build & Push
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: docker/Dockerfile.prod
                  push: true
                  build-args: |
                      GIT_BRANCH=${{ steps.ver.outputs.BRANCH }}
                      GIT_COMMIT=${{ steps.ver.outputs.COMMIT }}
                  tags: |
                      ${{ secrets.REGISTRY_URL }}/lms-genkiddo:${{ steps.ver.outputs.VERSION }}
                      ${{ secrets.REGISTRY_URL }}/lms-genkiddo:latest
                  labels: |
                      git.commit=${{ steps.ver.outputs.COMMIT }}
                      version=${{ steps.ver.outputs.VERSION }}

            - name: Deploy to Staging
              if: github.ref == 'refs/heads/develop'
              run: |
                  echo "🚀 Deploy to staging"
                  # Add staging deploy script

            - name: Deploy to Production
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  echo "🚀 Deploy to production"
                  # Add production deploy script
